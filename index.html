<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6d1230">
  <meta name="description" content="Tunezo is a burgundy-themed music player with artist playlists, seek bar, volume control, repeat and autoplay. Built with HTML, CSS and vanilla JavaScript.">
  <title>Tunezo — Music Player</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%236d1230'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23240811' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23d8b26e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Icon sprite: every icon in the app is referenced with <use href="#i-name"> -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></g></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="2.5" height="14" rx="1"/><path d="M19 5.5v13L9 12z"/></g></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="16.5" y="5" width="2.5" height="14" rx="1"/><path d="M5 5.5v13L15 12z"/></g></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></g></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></g></symbol>
    <symbol id="i-repeat-one" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><path d="M11 10.5l1.5-1v5.5"/></g></symbol>
    <symbol id="i-volume-high" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></g></symbol>
    <symbol id="i-volume-low" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></g></symbol>
    <symbol id="i-volume-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></g></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></g></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></g></symbol>
  </svg>

  <div class="app">

    <!-- ===== Top bar: brand + search ===== -->
    <header class="topbar">
      <a class="brand" href="./" aria-label="Tunezo home">
        <span class="brand__disc" aria-hidden="true"></span>
        <span class="brand__name">Tunezo</span>
      </a>
      <label class="search">
        <span class="sr-only">Search songs or artists</span>
        <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search songs or artists" autocomplete="off" spellcheck="false">
      </label>
    </header>

    <!-- ===== Sidebar: library + one playlist per artist (rendered by script.js) ===== -->
    <nav class="sidebar" id="nav" aria-label="Playlists"></nav>

    <!-- ===== Main: playlist header, artist shelf, song list ===== -->
    <main class="main" id="main">

      <section class="hero" id="hero" aria-labelledby="heroTitle">
        <div class="sleeve-wrap hero__sleeve">
          <div class="sleeve" id="heroSleeve">
            <span class="disc"></span>
            <span class="art art--artist"><span class="art__init" id="heroInit"></span></span>
          </div>
        </div>
        <div class="hero__body">
          <h1 class="hero__title" id="heroTitle"></h1>
          <p class="hero__meta" id="heroMeta"></p>
          <div class="hero__actions">
            <button class="btn btn--primary" id="heroPlay" type="button"></button>
            <button class="btn btn--ghost" id="heroShuffle" type="button">
              <svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg><span>Shuffle</span>
            </button>
          </div>
        </div>
      </section>

      <section class="section" id="shelfSection" aria-labelledby="shelfTitle">
        <div class="section__head">
          <h2 id="shelfTitle">Artist playlists</h2>
        </div>
        <div class="shelf" id="shelf"></div>
      </section>

      <section class="section" aria-labelledby="listTitle">
        <div class="section__head">
          <h2 id="listTitle">Songs</h2>
          <span class="section__count" id="listCount"></span>
          <div class="segmented" role="group" aria-label="Song layout">
            <button type="button" data-layout="list" aria-label="List view" title="List view"><svg class="i" aria-hidden="true"><use href="#i-list"/></svg></button>
            <button type="button" data-layout="grid" aria-label="Card view" title="Card view"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg></button>
          </div>
        </div>
        <ul class="songs is-list" id="songs"></ul>
      </section>

    </main>

    <!-- ===== Player bar ===== -->
    <section class="player" id="player" aria-label="Music player">

      <div class="player__info">
        <div class="art art--sm art--song" id="npArt"><span class="art__init" id="npInit">p</span></div>
        <div class="player__text">
          <p class="player__title" id="npTitle">Pick a song</p>
          <p class="player__artist" id="npArtist">Choose any song or playlist to start</p>
        </div>
      </div>

      <div class="player__center">
        <div class="controls">
          <button class="icon-btn" id="shuffleBtn" type="button" aria-pressed="false" aria-label="Shuffle" title="Shuffle (S)">
            <svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg>
          </button>
          <button class="icon-btn icon-btn--lg" id="prevBtn" type="button" aria-label="Previous song" title="Previous (P)">
            <svg class="i" aria-hidden="true"><use href="#i-prev"/></svg>
          </button>
          <button class="btn-play" id="playBtn" type="button" aria-label="Play" title="Play (Space)">
            <svg class="i" aria-hidden="true"><use href="#i-play"/></svg>
          </button>
          <button class="icon-btn icon-btn--lg" id="nextBtn" type="button" aria-label="Next song" title="Next (N)">
            <svg class="i" aria-hidden="true"><use href="#i-next"/></svg>
          </button>
          <button class="icon-btn" id="loopBtn" type="button" aria-pressed="false" aria-label="Repeat: off" title="Repeat (L)">
            <svg class="i" aria-hidden="true"><use href="#i-repeat"/></svg>
          </button>
        </div>
        <div class="seek">
          <span id="curTime">0:00</span>
          <input class="range" id="seekBar" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="player__extra">
        <button class="pill" id="autoBtn" type="button" aria-pressed="true" title="Play the next song automatically">Autoplay</button>
        <div class="volume">
          <button class="icon-btn" id="muteBtn" type="button" aria-label="Mute" title="Mute (M)">
            <svg class="i" aria-hidden="true"><use href="#i-volume-high"/></svg>
          </button>
          <input class="range" id="volBar" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">
        </div>
      </div>

    </section>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
